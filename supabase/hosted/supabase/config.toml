# Configuração parcial para o Supabase hospedado. Não iniciar uma stack local aqui.
# Preencher hosted/.env antes de executar config diff/push (ver README.md).
project_id = "orbit-resend"

[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"
site_url = "https://weorbit.com.br"
additional_redirect_urls = [
  "https://weorbit.com.br/auth/confirm**",
  "https://weorbit.com.br/login**",
  "https://orbit-ashen-six.vercel.app/auth/confirm**",
  "https://orbit-ashen-six.vercel.app/login**",
  "http://127.0.0.1:5173/auth/confirm**",
  "http://127.0.0.1:5173/login**",
  "http://localhost:5173/auth/confirm**",
  "http://localhost:5173/login**",
]

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(ORBIT_SMTP_SENDER_EMAIL)"
sender_name = "Orbit"
