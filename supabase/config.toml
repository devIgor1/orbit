project_id = "orbit"

[api]
enabled = true
port = 55521
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55522
shadow_port = 55520
major_version = 17

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 55523
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55524

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**", "http://127.0.0.1:5174/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = false

[functions.send-invitation]
verify_jwt = true
