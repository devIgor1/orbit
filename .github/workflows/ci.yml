name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validar workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: npm run lint
      - run: npm run check:styles
      - run: npm run check:architecture
      - run: npm run check:ai
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  ai-database:
    name: Permissões e cotas de IA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Iniciar Supabase local
        run: npx --yes supabase@2.121.0 start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Testar permissões, recusas e cotas
        run: npx --yes supabase@2.121.0 test db supabase/tests/ai_tasks.test.sql supabase/tests/ai_task_rejections.test.sql supabase/tests/ai_task_workspace_quota.test.sql supabase/tests/ai_task_quota_feedback.test.sql
      - run: npm run test:ai:concurrency

  pr-validation:
    name: Validações do PR
    needs: [quality, ai-database]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Consolidar CI e preview do commit do PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-pr.mjs
